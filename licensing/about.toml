# cargo-about: which licences a rebuilt crate may carry, and for which targets.
# A dependency under a licence missing here fails the build — add it only after
# reading what it asks of a redistributor.
accepted = [
    "Apache-2.0",
    "GPL-3.0-or-later",
    "ISC",
    "MIT",
    "Unicode-DFS-2016",
]
ignore-dev-dependencies = true
targets = ["x86_64-unknown-linux-musl", "aarch64-unknown-linux-musl"]
